name: Windows release build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to (e.g. v1.0.0); leave empty for a build-only dry run"
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DAIRBAND_COPY_AFTER_BUILD=OFF

      - name: Build VST3
        run: cmake --build build --config Release --target AirBand_VST3 -j 4

      - name: Build DSP tests
        run: cmake --build build --config Release --target AirBand_Tests -j 4

      - name: Run DSP tests
        shell: bash
        run: build/AirBand_Tests_artefacts/Release/AirBand_Tests.exe

      - name: Verify the VST3 needs no Visual C++ Redistributable
        shell: bash
        run: |
          DLL="build/AirBand_artefacts/Release/VST3/AirBand.vst3/Contents/x86_64-win/AirBand.vst3"
          if grep -aqiE 'vcruntime140|msvcp140' "$DLL"; then
            echo "VST3 still imports the dynamic MSVC runtime" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          VERSION=$(grep -m1 'project(AirBand VERSION' CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          DIST="dist/AirBand-${VERSION}-windows"
          mkdir -p "$DIST"
          cp -R "build/AirBand_artefacts/Release/VST3/AirBand.vst3" "$DIST/"
          cp README.md "$DIST/" || true
          cd dist
          7z a "AirBand-windows.zip" "AirBand-${VERSION}-windows"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer wizard
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\AirBand-$env:VERSION-windows" "/DRepoDir=$PWD" "/O$PWD\dist" installer\AirBand.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test installer (silent install, check, uninstall)
        shell: pwsh
        run: |
          $dll = "$env:CommonProgramFiles\VST3\AirBand.vst3\Contents\x86_64-win\AirBand.vst3"
          $p = Start-Process "dist\AirBand-windows-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path $dll)) { throw "plugin not installed at $dll" }
          if (-not (Test-Path "$env:ProgramFiles\AirBand\unins000.exe")) { throw "uninstaller missing" }
          Start-Process "$env:ProgramFiles\AirBand\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:CommonProgramFiles\VST3\AirBand.vst3"); $i++) { Start-Sleep 1 }
          if (Test-Path "$env:CommonProgramFiles\VST3\AirBand.vst3") { throw "uninstall left the plugin behind" }

      - name: Keep the zip and installer as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirBand-windows
          path: |
            dist/AirBand-windows.zip
            dist/AirBand-windows-setup.exe

      - name: Upload to release
        if: github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          gh release upload "$TAG" "dist/AirBand-windows.zip" "dist/AirBand-windows-setup.exe" --clobber --repo "${{ github.repository }}"
